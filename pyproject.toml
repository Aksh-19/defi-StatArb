[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-statarb"
version = "0.1.0"
description = "DeFi Statistical Arbitrage Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "web3",
    "requests",
    "aiohttp",
    "websockets",
    "sqlalchemy",
    "jupyter",
    "pytest",
    "pyyaml",
    "python-dotenv",
    "streamlit",
    "plotly"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
